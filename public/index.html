</style></head><body><div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
const {useState,useEffect,useRef,useContext,createContext}=React;
const html=htm.bind(React.createElement),Ctx=createContext(),useC=()=>useContext(Ctx);
const vnd=n=>Math.round(n).toLocaleString('de-DE')+' đ',pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dk(new Date()),mk=s=>s.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,9),num=s=>parseInt(String(s).replace(/\D/g,''),10)||0;
const fmtIn=s=>{const n=String(s).replace(/\D/g,'');return n?Number(n).toLocaleString('de-DE'):''};
const amtErr=v=>/[^\d.,\s]/.test(v)?(v.includes('-')?'Số tiền phải lớn hơn 0':'Số tiền chỉ được nhập chữ số'):'';
const dlabel=s=>{const t=new Date();if(s===dk(t))return'Hôm nay';t.setDate(t.getDate()-1);return s===dk(t)?'Hôm qua':s.slice(8)+'/'+s.slice(5,7)};
const DEF={expense:[['Ăn uống','🍜','#E5484D'],['Di chuyển','🚌','#2F6FED'],['Mua sắm','🛍️','#8B5CF6'],['Hóa đơn','🧾','#F59E0B'],['Giải trí','🎮','#EC4899'],['Học tập','📚','#6366F1'],['Sức khỏe','💊','#14B8A6'],['Khác','📦','#6B7A99']],income:[['Lương','💼','#1BAA63'],['Làm thêm','⏱️','#2F6FED'],['Thưởng','🎁','#F59E0B'],['Đầu tư','📈','#8B5CF6'],['Khác','📦','#6B7A99']]};
const catsOf=(d,t)=>DEF[t].concat((d.cats[t]||[]).map(n=>[n,'🏷️','#6B7A99'])),catMeta=(d,t,n)=>catsOf(d,t).find(c=>c[0]===n)||[n,'📦','#6B7A99'];
const sum=(tx,type,m)=>tx.filter(t=>t.type===type&&(!m||mk(t.date)===m)).reduce((s,t)=>s+t.amount,0);
const spent=(tx,cat,m)=>tx.filter(t=>t.type==='expense'&&t.cat===cat&&mk(t.date)===m).reduce((s,t)=>s+t.amount,0);
const bst=(sp,l)=>sp>l?{c:'var(--r)',l:'⚠ Vượt '+vnd(sp-l)}:sp/l>=.8?{c:'var(--o)',l:'Còn '+vnd(l-sp)}:{c:'var(--p)',l:'Còn '+vnd(l-sp)};
const empty=()=>({txs:[],budgets:[],jars:[],cats:{expense:[],income:[]}});
const seed=()=>{let k=0;const T=(o,type,cat,amount,note)=>{const ts=Date.now()-o*864e5-(k++)*1000;return{id:uid(),type,cat,amount,note,date:dk(new Date(ts)),ts}};
return{txs:[T(0,'expense','Ăn uống',80000,'Ăn trưa'),T(1,'expense','Di chuyển',45000,'Grab đi học'),T(1,'expense','Ăn uống',120000,'Cà phê & bánh'),T(2,'expense','Mua sắm',250000,'Áo thun'),T(2,'expense','Học tập',200000,'Sách giáo trình'),T(3,'income','Lương',12000000,'Lương tháng'),T(3,'income','Làm thêm',2500000,'Dạy kèm'),T(3,'expense','Ăn uống',120000,'Đi chợ')],
budgets:[{cat:'Ăn uống',limit:1000000},{cat:'Mua sắm',limit:500000},{cat:'Học tập',limit:400000}],
jars:[{id:uid(),name:'Quỹ khẩn cấp',ico:'🛟',target:10000000,saved:6500000,log:[{id:uid(),t:'in',a:6500000,date:today()}]},{id:uid(),name:'Mua laptop',ico:'💻',target:20000000,saved:4000000,log:[]}],cats:{expense:[],income:[]}}};
const KEY='qlct_v1';
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.users)return s}catch(e){}return{users:[{name:'Dương Đạt',email:'demo@demo.vn',pass:'Demo@123'}],data:{'demo@demo.vn':seed()},session:null}};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',stats:'M5 20V11M12 20V4M19 20v-6',bud:'M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2',me:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z'};
const Ic=({d,s=22})=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d=${d}/></svg>`;

let pushToast=()=>{};const toast=(m,k='ok')=>pushToast(m,k);
function Toasts(){const[l,setL]=useState([]);useEffect(()=>{pushToast=(m,k)=>{const id=uid();setL(a=>[...a,{id,m,k}]);setTimeout(()=>setL(a=>a.filter(x=>x.id!==id)),3400)}},[]);
return html`<div className="toasts">${l.map(t=>html`<div key=${t.id} className=${'toast '+t.k}>${{ok:'✓',err:'✕',warn:'⚠'}[t.k]} ${t.m}</div>`)}</div>`}
function Modal({onClose,center,children}){const[o,setO]=useState(false);const close=()=>{setO(true);setTimeout(onClose,220)};
return ReactDOM.createPortal(html`<div className=${'ov'+(o?' out':'')} onClick=${close}><div className=${(center?'dlg':'sheet')+(o?' out':'')} onClick=${e=>e.stopPropagation()}>${children(close)}</div></div>`,document.getElementById('root'))}
function Confirm({title,text,ok,danger,onYes,onClose}){return html`<${Modal} center onClose=${onClose}>${close=>html`<div><h3>${title}</h3><p className="mut">${text}</p><div className="row g8 mt"><button className="btn ghost" onClick=${close}>Huỷ</button><button className=${'btn'+(danger?' red':'')} onClick=${()=>{onYes();close()}}>${ok}</button></div></div>`}<//>`}
const Field=({label,err,children})=>html`<div className="fld"><label>${label}</label>${children}${err&&html`<div className="err">${err}</div>`}</div>`;
const Amt=({v,set,err})=>html`<div className=${'in amt'+(err?' bad':'')}><input inputMode="numeric" placeholder="0" value=${v} onChange=${ev=>set(ev.target.value)}/><b>đ</b></div>`;
const Btn=({busy,cls='',children,...p})=>html`<button ...${p} className=${'btn '+cls} disabled=${busy}>${busy?html`<i className="sp"></i>`:children}</button>`;
function Head({t}){const{r,go}=useC();return html`<div className="row" style=${{padding:'22px 0 6px'}}><button className="bk" onClick=${()=>go(r.from&&r.from!==r.n?r.from:'home')}><${Ic} d=${IC.back} s=${18}/></button><h1>${t}</h1></div>`}
function Tx({t,d}){const c=catMeta(d,t.type,t.cat),inc=t.type==='income';return html`<div className="tx"><div className="ico" style=${{background:c[2]+'22'}}>${c[1]}</div><div className="f1"><b>${t.cat}</b><div className="mut">${t.note||'—'} · ${dlabel(t.date)}</div></div><b className=${inc?'pos':'neg'}>${inc?'+':'-'}${vnd(t.amount)}</b></div>`}

/* ===== LUỒNG 1: ĐĂNG KÝ / ĐĂNG NHẬP ===== */
function Auth(){const{db,setDb,enter}=useC();const[reg,setReg]=useState(false),[f,setF]=useState({name:'',email:'',phone:'',pass:'',terms:false,rem:true}),[e,setE]=useState({}),[busy,setBusy]=useState(false),[show,setShow]=useState(false),[shake,setShake]=useState(0),lock=useRef(false);
const set=k=>ev=>{setF({...f,[k]:ev.target.type==='checkbox'?ev.target.checked:ev.target.value});setE({...e,[k]:'',form:''})};
const fail=x=>{setE(x);setShake(s=>s+1);setBusy(false);lock.current=false};
const submit=ev=>{ev.preventDefault();if(lock.current)return;const x={},em=f.email.trim().toLowerCase();
if(reg&&!f.name.trim())x.name='Vui lòng nhập họ tên';
if(!em)x.email='Vui lòng nhập email';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))x.email='Email không đúng định dạng';

/* ===== AI SMART EXPENSE (FR-AI-01): lớp AIS gọi Backend API độc lập =====
   Frontend KHÔNG chứa API key và KHÔNG chứa prompt: mọi lời gọi AI do backend thực hiện.
   Địa chỉ backend: <meta name="api-base" content="https://api.example.com"> (để trống = cùng domain với trang).
   GET  /api/health                                  -> {ok,ai:{configured}}
   POST /api/ai/parse-text    {text,ctx}             -> {items:[{type,amount,cat,note,date}],reply}
   POST /api/ai/parse-receipt {image(base64),mimeType,ctx} -> {readable,merchant,type,amount,cat,note,date}
   Lỗi: HTTP 4xx/5xx + {error:{code,message}}. Không có AI thì báo rõ, KHÔNG giả lập kết quả. */
const clean=(i,x)=>{const t=i.type==='income'?'income':'expense',a=Math.round(Number(i.amount)),ok=/^\d{4}-\d\d-\d\d$/.test(i.date||'')&&i.date<=today();return{op:uid(),type:t,amount:a>0?a:0,cat:x.cats[t].includes(i.cat)?i.cat:'Khác',note:String(i.note||'').slice(0,80),date:ok?i.date:today(),noDate:!ok}};
const shrink=async f=>{let b;try{b=await createImageBitmap(f)}catch(e){throw{code:'bad_image'}}const k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85)).then(x=>{if(!x)throw{code:'bad_image'};return x})};
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no({code:'bad_image'});r.readAsDataURL(blob)});
const API_BASE=((document.querySelector('meta[name="api-base"]')||{}).content||'').trim().replace(/\/+$/,'');
const AIS={why:'unavailable',
async mode(){try{const r=await fetch(API_BASE+'/api/health',{cache:'no-store'}),j=r.ok?await r.json():null;if(j&&j.ai&&j.ai.configured)return'api';this.why=j?'not_configured':'unavailable'}catch(e){this.why='unavailable'}return null},
async post(path,body){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);let r,j=null;
try{r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});try{j=await r.json()}catch(e){}}
catch(e){throw{code:e&&e.name==='AbortError'?'ai_timeout':'unavailable'}}finally{clearTimeout(tm)}
if(!r.ok)throw{code:(j&&j.error&&j.error.code)||(r.status>=500?'unavailable':'http_'+r.status)};return j||{}},
async parseText(t,x){const o=await this.post('/api/ai/parse-text',{text:t,ctx:x});if(!Array.isArray(o.items))throw{code:'ai_invalid_output'};return{reply:String(o.reply||''),items:o.items.slice(0,10).map(i=>clean(i,x))}},

<div className="row g8" style=${{padding:'10px 20px 18px',borderTop:'1px solid var(--b)'}}><div className="in f1"><input disabled=${!mode} placeholder=${mode?'Nhập giao dịch bằng tiếng Việt…':'AI chưa kết nối'} value=${v} maxLength="500" onChange=${ev=>setV(ev.target.value)} onKeyDown=${ev=>{if(ev.key==='Enter')send()}}/></div><button className="fab" style=${{margin:0,width:46,height:46,opacity:mode&&v.trim()&&!busy?1:.5}} disabled=${!mode||busy} aria-label="Gửi" onClick=${send}>➤</button></div></div>`}
function Scan({mode,hide}){const{d,go}=useC();const[file,setFile]=useState(null),[url,setUrl]=useState(''),[busy,setBusy]=useState(false),[dr,setDr]=useState(null),[err,setErr]=useState('');
const pick=ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;if(!/^image\//.test(f.type)){toast('Vui lòng chọn file ảnh','err');return}if(f.size>15e6){toast('Ảnh quá lớn (tối đa 15MB)','err');return}setFile(f);setUrl(URL.createObjectURL(f));setDr(null);setErr('')};
const run=async()=>{if(busy||!file||!mode)return;setBusy(true);setErr('');setDr(null);try{setDr(await AIS.parseReceipt(file,aiCtx(d)));toast('AI đã đọc xong hóa đơn, hãy kiểm tra thông tin')}catch(e){setErr(aiErr(e));toast('Không nhận diện được hóa đơn','err')}setBusy(false)};
return html`<div style=${{flex:1,overflowY:'auto',padding:'0 20px 24px',display:hide?'none':'block'}}><div className=${'scanbox'+(busy?' on':'')}>${url?html`<img src=${url} alt="Ảnh hóa đơn"/>`:'Chưa có ảnh hóa đơn'}</div>
<div className="row g8 mt"><label className="btn ghost" style=${{cursor:'pointer'}}>📷 Tải ảnh từ thiết bị<input type="file" accept="image/*" hidden onChange=${pick}/></label><${Btn} busy=${busy} disabled=${!file||!mode} onClick=${run}>Phân tích bằng AI<//></div>
${err&&html`<div className="alert" style=${{background:'var(--rl)',color:'var(--r)',cursor:'default'}}>${err}</div>`}${err&&mode&&html`<button className="btn ghost mt" onClick=${()=>go('add',{type:'expense'})}>Nhập thủ công</button>`}
${dr&&html`<div key=${dr.op}><${DraftCard} dr=${dr}/><button className="btn ghost" onClick=${()=>{setFile(null);setUrl('');setDr(null)}}>Quét hóa đơn khác</button></div>`}</div>`}
const SPK='M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z';
function AiChoice({close,go}){const[pk,setPk]=useState(null);const pick=t=>{if(pk)return;setPk(t);setTimeout(()=>go('ai',{tab:t}),320)};
return html`<div><div className="row sb"><div className="row g8"><span className="aiic" style=${{width:36,height:36,borderRadius:12,background:'var(--pl)',color:'var(--pd)'}}><${Ic} d=${SPK} s=${20}/></span><h3 style=${{margin:0}}>Trợ lý AI</h3></div><button className="bk" aria-label="Đóng" onClick=${close}>✕</button></div>
<p style=${{margin:'14px 0',fontSize:14,color:'var(--ts)'}}>Bạn muốn nhập giao dịch bằng cách nào?</p>
${[['chat','CHAT VỚI AI','Nhập chi tiêu bằng ngôn ngữ tự nhiên','M21 12a8 8 0 01-11.6 7.1L3 21l1.9-6.2A8 8 0 1121 12z'],['scan','QUÉT HÓA ĐƠN','Chụp hoặc tải ảnh hóa đơn để AI phân tích','M4 8h3l2-3h6l2 3h3v12H4zM12 17a4 4 0 100-8 4 4 0 000 8z']].map(([k,t,s,ic])=>html`<button key=${k} className=${'opt'+(pk===k?' on':'')} disabled=${!!pk&&pk!==k} onClick=${()=>pick(k)}><span className="optic"><${Ic} d=${ic} s=${26}/></span><span className="f1"><b>${t}</b><span className="mut">${s}</span></span>${pk===k?html`<i className="sp" style=${{borderColor:'var(--pl)',borderTopColor:'var(--p)'}}></i>`:html`<span style=${{fontSize:22,color:'var(--tf)'}}>›</span>`}</button>`)}</div>`}
function Ai({tab:t0}){const[tab,setTab]=useState(t0||'chat'),[mode,setMode]=useState(undefined),chk=()=>{setMode(undefined);AIS.mode().then(setMode)};useEffect(()=>{chk()},[]);
return html`<div style=${{position:'absolute',inset:0,display:'flex',flexDirection:'column',animation:'in .35s'}}><div style=${{padding:'0 20px'}}><${Head} t="AI Smart Expense"/><div className="seg mt" style=${{marginTop:8}}>${[['chat','💬 AI Chat'],['scan','🧾 Quét hóa đơn']].map(([k,l])=>html`<button key=${k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
${mode===null&&html`<div className="alert" style=${{background:'var(--ol)',color:'var(--o)',cursor:'pointer'}} onClick=${chk}>${aiErr({code:AIS.why})} <b>Chạm để thử lại.</b></div>`}</div>
<${Chat} mode=${mode} hide=${tab!=='chat'}/><${Scan} mode=${mode} hide=${tab!=='scan'}/></div>`}

function App(){const[db,setDb]=useState(load),[user,setUser]=useState(()=>db.users.find(u=>u.email===db.session)||null),[r,setR]=useState({n:'home'});
useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}},[db]);
const go=(n,p)=>setR(c=>({...p,n,from:c.n})),enter=(u,rem)=>{setUser(u);setDb(x=>({...x,session:rem?u.email:null}));setR({n:'home'})},logout=()=>{setUser(null);setDb(x=>({...x,session:null}));toast('Đã đăng xuất')};
const d=user?(db.data[user.email]||empty()):null,upd=fn=>setDb(x=>({...x,data:{...x.data,[user.email]:fn(x.data[user.email]||empty())}}));
const S={home:Home,add:Add,budget:Budget,hist:Hist,stats:Stats,jars:Jars,cats:Cats,me:Me,ai:Ai}[r.n],N=[['home','Trang chủ','home'],['stats','Thống kê','stats'],null,['budget','Ngân sách','bud'],['me','Cá nhân','me']];
return html`<${Ctx.Provider} value=${{db,setDb,user,d,upd,r,go,enter,logout}}><${Toasts}/>${!user?html`<${Auth}/>`:html`<div style=${{height:'100%'}}><${S} key=${r.n} ...${r}/>
${r.n!=='add'&&r.n!=='ai'&&html`<div className="nav">${N.map((n,i)=>n?html`<button key=${n[0]} className=${'ni'+(r.n===n[0]?' on':'')} onClick=${()=>go(n[0])}><${Ic} d=${IC[n[2]]}/>${n[1]}</button>`:html`<button key=${i} className="fab" aria-label="Thêm giao dịch" onClick=${()=>go('add',{type:'expense'})}><${Ic} d=${IC.plus} s=${26}/></button>`)}</div>`}</div>`}<//>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
