.amt input{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums lining-nums}.amt b{color:var(--ts)}

.col{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}.col div{flex:1;text-align:center;font-size:10.5px;color:var(--ts);height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.col i{display:block;border-radius:6px 6px 2px 2px;background:var(--p);transition:height .35s ease-out;min-height:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ts);display:inline-block;margin:0 2px;animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-4px);opacity:.45}}
.bub{max-width:88%;padding:10px 14px;border-radius:14px;animation:in .18s ease-out;line-height:1.45}.bub.u{align-self:flex-end;background:var(--p);color:#F8FAFC;border-bottom-right-radius:4px}.bub.a{align-self:flex-start;background:var(--card);border:1px solid var(--b);border-bottom-left-radius:4px}

.scanbox.on::after{content:'';position:absolute;left:0;right:0;height:2px;background:var(--p);box-shadow:0 0 8px var(--p);animation:scan 1.5s ease-in-out infinite}@keyframes scan{0%,100%{top:0}50%{top:calc(100% - 2px)}}

<script>
const {useState,useEffect,useRef,useContext,createContext}=React;
const html=htm.bind(React.createElement),Ctx=createContext(),useC=()=>useContext(Ctx);
const vnd=n=>Math.round(n).toLocaleString('de-DE')+' đ',pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),today=()=>dk(new Date()),mk=s=>s.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,9),num=s=>parseInt(String(s).replace(/\D/g,''),10)||0;
const fmtIn=s=>{const n=String(s).replace(/\D/g,'');return n?Number(n).toLocaleString('de-DE'):''};
const amtErr=v=>/[^\d.,\s]/.test(v)?(v.includes('-')?'Số tiền phải lớn hơn 0':'Số tiền chỉ được nhập chữ số'):'';
const dlabel=s=>{const t=new Date();if(s===dk(t))return'Hôm nay';t.setDate(t.getDate()-1);return s===dk(t)?'Hôm qua':s.slice(8)+'/'+s.slice(5,7)};
const DEF={expense:[['Ăn uống','🍜','#E5484D'],['Di chuyển','🚌','#2F6FED'],['Mua sắm','🛍️','#8B5CF6'],['Hóa đơn','🧾','#F59E0B'],['Giải trí','🎮','#EC4899'],['Học tập','📚','#6366F1'],['Sức khỏe','💊','#14B8A6'],['Khác','📦','#6B7A99']],income:[['Lương','💼','#1BAA63'],['Làm thêm','⏱️','#2F6FED'],['Thưởng','🎁','#F59E0B'],['Khác','📦','#6B7A99']]};
const catsOf=(d,t)=>DEF[t],catMeta=(d,t,n)=>catsOf(d,t).find(c=>c[0]===n)||[n,'📦','#6B7A99'];
const sum=(tx,type,m)=>tx.filter(t=>t.type===type&&(!m||mk(t.date)===m)).reduce((s,t)=>s+t.amount,0);
const empty=()=>({initialBalance:null,txs:[]});
const KEY='qlct_group6_v1';
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.users)return s}catch(e){}return{users:[{name:'Nhóm 6',email:'demo@demo.vn',pass:'Demo@123'}],data:{'demo@demo.vn':empty()},session:'demo@demo.vn'}};
const IC={home:'M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z',plus:'M12 5v14M5 12h14',scan:'M4 8h3l2-3h6l2 3h3v12H4zM12 17a4 4 0 100-8 4 4 0 000 8z',me:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',back:'M15 5l-7 7 7 7',eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z'};
const Ic=({d,s=20})=>html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d=${d}/></svg>`;

let pushToast=()=>{};const toast=(m,k='ok')=>pushToast(m,k);
function Toasts(){const[l,setL]=useState([]);useEffect(()=>{pushToast=(m,k)=>{const id=uid();setL(a=>[...a,{id,m,k}]);setTimeout(()=>setL(a=>a.filter(x=>x.id!==id)),3200)}},[]);
return html`<div className="toasts">${l.map(t=>html`<div key=${t.id} className=${'toast '+t.k}>${{ok:'✓',err:'✕',warn:'⚠'}[t.k]} ${t.m}</div>`)}</div>`}
function Modal({onClose,center,children}){const[o,setO]=useState(false);const close=()=>{setO(true);setTimeout(onClose,200)};
return ReactDOM.createPortal(html`<div className=${'ov'+(o?' out':'')} onClick=${close}><div className=${(center?'dlg':'sheet')+(o?' out':'')} onClick=${e=>e.stopPropagation()}>${children(close)}</div></div>`,document.getElementById('root'))}
function Confirm({title,text,ok,danger,onYes,onClose}){return html`<${Modal} center onClose=${onClose}>${close=>html`<div><h3>${title}</h3><p className="mut">${text}</p><div className="row g8 mt"><button className="btn ghost" onClick=${close}>Huỷ</button><button className=${'btn'+(danger?' red':'')} onClick=${()=>{onYes();close()}}>${ok}</button></div></div>`}<//>`}
function TermsModal({tab='terms',close}){const[cur,setCur]=useState(tab);
return html`<div><h3>${cur==='terms'?'Điều khoản sử dụng':'Chính sách quyền riêng tư'}</h3>
<div className="seg mt">${[['terms','Điều khoản'],['privacy','Quyền riêng tư']].map(([k,l])=>html`<button key=${k} type="button" className=${cur===k?'on':''} onClick=${()=>setCur(k)}>${l}</button>`)}</div>
${cur==='terms'?html`<div className="terms-box"><b>Tóm tắt Điều khoản sử dụng</b><ul><li>Ứng dụng hỗ trợ ghi chép thu chi cá nhân, theo dõi số dư và hỗ trợ phân tích hóa đơn/giao dịch phục vụ mục đích học tập & quản lý cá nhân.</li><li>Người dùng chịu trách nhiệm với tính chính xác của số tiền, danh mục và ghi chú đã nhập.</li><li>Không sử dụng hệ thống cho các hành vi vi phạm pháp luật hoặc gây quá tải dịch vụ.</li></ul></div>`:html`<div className="terms-box"><b>Tóm tắt Chính sách quyền riêng tư</b><ul><li>Dữ liệu tài khoản demo, số dư và lịch sử giao dịch trên bản này được lưu cục bộ trên trình duyệt của bạn (localStorage), và ảnh hóa đơn chỉ gửi đi khi bạn bấm phân tích AI.</li><li>Chúng tôi không bán hoặc chia sẻ dữ liệu chi tiêu cá nhân của bạn cho bên thứ ba trái phép.</li><li>Bạn có thể xoá dữ liệu hoặc đăng xuất bất kỳ lúc nào tại mục Cá nhân.</li></ul></div>`}
<div className="mt"><button className="btn" onClick=${close}>Đã hiểu</button></div></div>`}
const Field=({label,err,children})=>html`<div className="fld"><label>${label}</label>${children}${err&&html`<div className="err">${err}</div>`}</div>`;
const Amt=({v,set,err})=>html`<div className=${'in amt'+(err?' bad':'')}><input inputMode="numeric" placeholder="0" value=${v} onChange=${ev=>set(ev.target.value)}/><b>đ</b></div>`;
const Btn=({busy,cls='',children,...p})=>html`<button ...${p} className=${'btn '+cls} disabled=${busy}>${busy?html`<i className="sp"></i>`:children}</button>`;
function Head({t}){const{r,go}=useC();return html`<div className="row" style=${{padding:'20px 0 6px'}}><button className="bk" onClick=${()=>go(r.from&&r.from!==r.n?r.from:'home')}><${Ic} d=${IC.back} s=${18}/></button><h1>${t}</h1></div>`}
function Tx({t,d}){const c=catMeta(d,t.type,t.cat),inc=t.type==='income';return html`<div className="tx"><div className="ico" style=${{background:c[2]+'22'}}>${c[1]}</div><div className="f1"><b>${t.cat}</b><div className="mut">${t.note||'—'} · ${dlabel(t.date)}</div></div><b className=${inc?'pos':'neg'}>${inc?'+':'-'}${vnd(t.amount)}</b></div>`}

function InitBalModal({cur,close}){const{upd}=useC();const[v,setV]=useState(cur!==null?fmtIn(cur):''),[e,setE]=useState('');
const save=()=>{const a=num(v);if(!v||a<=0){setE('Vui lòng nhập số dư ban đầu lớn hơn 0');return}upd(x=>({...x,initialBalance:a}));toast('Đã thiết lập số dư ban đầu');close()};
return html`<div><h3>Thiết lập số dư ban đầu</h3><p className="mut">Nhập số tiền hiện có để tính số dư khả dụng chính xác.</p>
<${Field} label="Số dư ban đầu" err=${e}><${Amt} v=${v} err=${e} set=${x=>{setV(fmtIn(x));setE(amtErr(x))}}/><//>
<div className="row g8 mt" style=${{marginTop:20}}><button className="btn ghost" onClick=${close}>Huỷ</button><button className="btn" onClick=${save}>Lưu số dư</button></div></div>`}

function Auth(){const{db,setDb,enter}=useC();const[reg,setReg]=useState(false),[f,setF]=useState({name:'',email:'',pass:'',rem:true,agree:false}),[e,setE]=useState({}),[busy,setBusy]=useState(false),[show,setShow]=useState(false),[shake,setShake]=useState(0),[termsOpen,setTermsOpen]=useState(null),lock=useRef(false);
const set=k=>ev=>{setF({...f,[k]:ev.target.type==='checkbox'?ev.target.checked:ev.target.value});setE({...e,[k]:'',form:''})};
const fail=x=>{setE(x);setShake(s=>s+1);setBusy(false);lock.current=false};
const submit=ev=>{ev.preventDefault();if(lock.current)return;const x={},em=f.email.trim().toLowerCase();
if(reg&&!f.name.trim())x.name='Vui lòng nhập họ tên';
if(!em)x.email='Vui lòng nhập email';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))x.email='Email không đúng định dạng';
if(!f.pass)x.pass='Vui lòng nhập mật khẩu';else if(reg&&f.pass.length<6)x.pass='Mật khẩu tối thiểu 6 ký tự';
if(reg&&!f.agree)x.agree='Vui lòng đồng ý với Điều khoản sử dụng và Chính sách quyền riêng tư';
if(Object.keys(x).length){fail(x);toast('Vui lòng kiểm tra lại thông tin','err');return}
lock.current=true;setBusy(true);
setTimeout(()=>{const ex=db.users.find(u=>u.email===em);
if(reg){if(ex){fail({email:'Email đã tồn tại.'});toast('Email đã tồn tại','err');return}
const u={name:f.name.trim(),email:em,pass:f.pass};setDb(d=>({...d,users:[...d.users,u],data:{...d.data,[em]:empty()}}));toast('Đăng ký thành công');enter(u,true)}
else{if(!ex||ex.pass!==f.pass){fail({form:'Email hoặc mật khẩu không đúng'});toast('Đăng nhập thất bại','err');return}toast('Đăng nhập thành công');enter(ex,f.rem)}},500)};
return html`<div className="scr" style=${{paddingTop:36}}>

function Home(){const{d,go}=useC();const[balOpen,setBalOpen]=useState(false);const now=new Date(),m=dk(now).slice(0,7);

return html`<div className="scr"><div style=${{padding:'20px 0 8px'}}><h1>Trang chủ</h1></div>
<div className="hero"><div style=${{fontSize:13,opacity:.9}}>Số dư khả dụng</div><div className="big" key=${bal}>${vnd(bal)}</div><div style=${{fontSize:12,opacity:.88,marginTop:4}}>${hasInit?'Đã thiết lập số dư ban đầu':'Chưa thiết lập số dư ban đầu'}</div></div>
${!hasInit&&html`<div className="card" style=${{padding:14}}><div className="alert" style=${{marginTop:0,background:'var(--ol)',color:'var(--o)'}}>⚠ Vui lòng thiết lập số dư ban đầu trước khi thêm khoản chi.</div><button className="btn mt" onClick=${()=>setBalOpen(true)}>Thiết lập số dư ban đầu</button></div>`}

function Add({type}){const{d,upd,go}=useC();const[t,setT]=useState(type||'expense'),[f,setF]=useState({amt:'',cat:'',note:'',date:today()}),[e,setE]=useState({}),[busy,setBusy]=useState(false),[ok,setOk]=useState(null),lock=useRef(false),op=useRef(uid());
const isE=t==='expense',cats=catsOf(d,t);
const save=()=>{if(lock.current)return;const x={},a=num(f.amt);
if(!f.amt)x.amt='Vui lòng nhập số tiền';else if(a<=0)x.amt='Số tiền phải lớn hơn 0';else if(e.amt)x.amt=e.amt;
if(!f.cat)x.cat='Vui lòng chọn danh mục';
if(Object.keys(x).length){setE(x);toast(x.amt||x.cat,'err');return}

setTimeout(()=>{const id=op.current,date=f.date||today(),ts=date===today()?Date.now():new Date(date+'T12:00:00').getTime(),tx={id:uid(),op:id,type:t,cat:f.cat,amount:a,note:f.note.trim(),date,ts};
upd(x=>x.txs.some(y=>y.op===id)?x:{...x,txs:[tx,...x.txs]});setBusy(false);setOk(tx);toast('Đã lưu '+(isE?'khoản chi ':'khoản thu ')+vnd(a))},350)};
const again=()=>{op.current=uid();lock.current=false;setOk(null);setF({amt:'',cat:'',note:'',date:today()});setE({})};
if(ok){const c=catMeta(d,ok.type,ok.cat);return html`<div className="scr" style=${{textAlign:'center',paddingTop:56}}>
<div className="ico" style=${{width:76,height:76,borderRadius:'50%',background:'var(--gl)',color:'var(--g)',fontSize:36,margin:'0 auto'}}>✓</div>
<h1 style=${{marginTop:16}}>Đã lưu ${ok.type==='expense'?'khoản chi':'khoản thu'}</h1><div className=${'big '+(ok.type==='income'?'pos':'neg')}>${ok.type==='income'?'+':'-'}${vnd(ok.amount)}</div>
<div className="card" style=${{textAlign:'left'}}><div className="row sb"><span className="mut">Danh mục</span><b>${c[1]} ${ok.cat}</b></div><div className="row sb" style=${{marginTop:10}}><span className="mut">Ghi chú</span><b>${ok.note||'—'}</b></div><div className="row sb" style=${{marginTop:10}}><span className="mut">Ngày</span><b>${dlabel(ok.date)}</b></div></div>
<div className="mt"><button className="btn" onClick=${()=>go('home')}>Quay về trang chủ</button></div><div className="mt" style=${{marginTop:10}}><button className="btn ghost" onClick=${again}>Thêm giao dịch khác</button></div></div>`}
return html`<div className="scr" style=${{paddingBottom:30}}><${Head} t=${isE?'Thêm khoản chi':'Thêm khoản thu'}/>
<div className="seg mt">${[['expense','Chi tiêu'],['income','Thu nhập']].map(([k,l])=>html`<button key=${k} className=${t===k?'on':''} onClick=${()=>{setT(k);setF({...f,cat:''});setE({})}}>${l}</button>`)}</div>
<${Field} label="Số tiền" err=${e.amt}><${Amt} v=${f.amt} err=${e.amt} set=${v=>{setF({...f,amt:fmtIn(v)});setE({...e,amt:amtErr(v)})}}/><//>
<${Field} label="Danh mục" err=${e.cat}><div className="grid">${cats.map(c=>html`<button key=${c[0]} type="button" className=${'cb'+(f.cat===c[0]?' on':'')} onClick=${()=>{setF({...f,cat:c[0]});setE({...e,cat:''})}}><span>${c[1]}</span>${c[0]}</button>`)}</div><//>
<${Field} label="Ghi chú"><div className="in"><input placeholder="Ví dụ: Ăn trưa" maxLength="80" value=${f.note} onChange=${ev=>setF({...f,note:ev.target.value})}/></div><//>
<${Field} label="Ngày"><div className="in"><input type="date" max=${today()} value=${f.date} onChange=${ev=>setF({...f,date:ev.target.value})}/></div><//>
<div className="mt" style=${{marginTop:20}}><${Btn} busy=${busy} onClick=${save}>${isE?'Lưu khoản chi':'Lưu khoản thu'}<//></div></div>`}

function Hist(){const{d}=useC();const[m,setM]=useState(mk(today())),[fl,setFl]=useState('all');
const shift=n=>{const[y,mo]=m.split('-').map(Number),x=new Date(y,mo-1+n,1);setM(x.getFullYear()+'-'+pad(x.getMonth()+1))};
const list=d.txs.filter(t=>mk(t.date)===m&&(fl==='all'||t.type===fl)).sort((a,b)=>b.ts-a.ts),days=[...new Set(list.map(t=>t.date))];
return html`<div className="scr"><${Head} t="Lịch sử giao dịch"/>
<div className="row sb mt"><button className="bk" onClick=${()=>shift(-1)}>‹</button><b>Tháng ${m.slice(5)}/${m.slice(0,4)}</b><button className="bk" onClick=${()=>shift(1)}>›</button></div>
<div className="row g8 mt">${[['all','Tất cả'],['expense','Chi tiêu'],['income','Thu nhập']].map(([k,l])=>html`<button key=${k} className=${'chip'+(fl===k?' on':'')} onClick=${()=>setFl(k)}>${l}</button>`)}</div>
<div className="row sb mt"><span className="pos"><b>Thu ${vnd(sum(list,'income'))}</b></span><span className="neg"><b>Chi ${vnd(sum(list,'expense'))}</b></span></div>
${days.map(day=>{const g=list.filter(t=>t.date===day);return html`<div key=${day} className="card" style=${{padding:'12px 16px'}}><div className="row sb mut"><b>${dlabel(day)}</b><span>${vnd(sum(g,'income')-sum(g,'expense'))}</span></div>${g.map(t=>html`<${Tx} key=${t.id} t=${t} d=${d}/>`)}</div>`})}
${!list.length&&html`<div className="card" style=${{textAlign:'center'}}><p className="mut">Không có giao dịch nào trong tháng này</p></div>`}</div>`}

function Me(){const{user,d,logout,upd,go}=useC();const[c,setC]=useState(null),[balOpen,setBalOpen]=useState(false);
return html`<div className="scr"><div style=${{textAlign:'center',padding:'28px 0 8px'}}><div className="ico" style=${{width:68,height:68,borderRadius:20,background:'var(--pl)',color:'var(--p)',fontSize:28,fontWeight:800,margin:'0 auto'}}>${user.name.charAt(0).toUpperCase()}</div><h1 style=${{marginTop:12}}>${user.name}</h1><p className="mut">${user.email}</p></div>
<div className="card" style=${{padding:'4px 16px'}}>
<button className="tx tap" onClick=${()=>setBalOpen(true)} style=${{width:'100%',background:'none',border:0,borderBottom:'1px solid var(--b)',color:'var(--t)',fontSize:14,fontWeight:600,textAlign:'left'}}><span style=${{fontSize:20}}>💰</span><span className="f1">Số dư ban đầu (${d.initialBalance!==null?vnd(d.initialBalance):'Chưa đặt'})</span>›</button>
<button className="tx tap" onClick=${()=>go('hist')} style=${{width:'100%',background:'none',border:0,color:'var(--t)',fontSize:14,fontWeight:600,textAlign:'left'}}><span style=${{fontSize:20}}>🕘</span><span className="f1">Lịch sử giao dịch</span>›</button>
</div>
<button className="btn ghost mt" onClick=${()=>setC('clear')}>Xoá dữ liệu hiện tại</button>
<div className="mt" style=${{marginTop:10}}><button className="btn red" onClick=${()=>setC('out')}>Đăng xuất</button></div>
${balOpen&&html`<${Modal} center onClose=${()=>setBalOpen(false)}>${close=>html`<${InitBalModal} cur=${d.initialBalance} close=${close}/>`}<//>`}
${c==='out'&&html`<${Confirm} danger title="Đăng xuất?" text="Bạn sẽ quay về màn hình đăng nhập." ok="Đăng xuất" onYes=${logout} onClose=${()=>setC(null)}/>`}
${c==='clear'&&html`<${Confirm} danger title="Xoá dữ liệu?" text="Toàn bộ số dư ban đầu và giao dịch sẽ được xoá." ok="Xoá" onYes=${()=>{upd(()=>empty());toast('Đã xoá dữ liệu')}} onClose=${()=>setC(null)}/>`}</div>`}

const clean=(i,x)=>{const t=i.type==='income'?'income':'expense',a=Math.round(Number(i.amount)),ok=/^\d{4}-\d\d-\d\d$/.test(i.date||'')&&i.date<=today();return{op:uid(),type:t,amount:a>0?a:0,cat:x.cats[t].includes(i.cat)?i.cat:'Khác',note:String(i.note||'').slice(0,80),date:ok?i.date:today(),noDate:!ok}};
const shrink=async f=>{let b;try{b=await createImageBitmap(f)}catch(e){throw{code:'bad_image'}}const k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.85)).then(x=>{if(!x)throw{code:'bad_image'};return x})};
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no({code:'bad_image'});r.readAsDataURL(blob)});
const API_BASE=((document.querySelector('meta[name="api-base"]')||{}).content||'').trim().replace(/\/+$/,'');
const AIS={why:'unavailable',
async mode(){try{const r=await fetch(API_BASE+'/api/health',{cache:'no-store'}),j=r.ok?await r.json():null;if(j&&j.ai&&j.ai.configured)return'api';this.why=j?'not_configured':'unavailable'}catch(e){this.why='unavailable'}return null},
async post(path,body){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);let r,j=null;
try{r=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});try{j=await r.json()}catch(e){}}
catch(e){throw{code:e&&e.name==='AbortError'?'ai_timeout':'unavailable'}}finally{clearTimeout(tm)}
if(!r.ok)throw{code:(j&&j.error&&j.error.code)||(r.status>=500?'unavailable':'http_'+r.status)};return j||{}},
async parseReceipt(f,x){const o=await this.post('/api/ai/parse-receipt',{image:await b64(await shrink(f)),mimeType:'image/jpeg',ctx:x}),a=Number(o.amount);if(!o.readable||!(a>0))throw{code:'receipt_unreadable'};return clean({type:o.type,amount:a,cat:o.cat,note:o.note||o.merchant,date:o.date},x)}};
const aiCtx=d=>({today:today(),cats:{expense:catsOf(d,'expense').map(c=>c[0]),income:catsOf(d,'income').map(c=>c[0])}});
const aiErr=e=>({unavailable:'Không kết nối được máy chủ AI. Vui lòng kiểm tra mạng và thử lại sau.',not_configured:'Tính năng AI chưa được cấu hình trên máy chủ.',ai_not_configured:'Tính năng AI chưa được cấu hình trên máy chủ.',ai_timeout:'AI phản hồi quá lâu, vui lòng thử lại.',receipt_unreadable:'Không nhận diện được tổng tiền trên ảnh. Hãy tải ảnh rõ hơn hoặc nhập thủ công.',bad_image:'Không đọc được ảnh này. Hãy dùng ảnh JPG, PNG hoặc WebP.'}[e&&e.code]||'Không thể xử lý yêu cầu lúc này.');

function DraftCard({dr,onDone}){const{d,upd,go}=useC();const[f,setF]=useState({type:dr.type,amt:dr.amount?fmtIn(dr.amount):'',cat:dr.cat,note:dr.note,date:dr.date}),[e,setE]=useState(dr.amount?{}:{amt:'AI không xác định được số tiền, vui lòng nhập'}),[busy,setBusy]=useState(false),lock=useRef(false),cats=catsOf(d,f.type);
const ok=()=>{if(lock.current)return;const a=num(f.amt),x={};if(a<=0)x.amt='Số tiền phải lớn hơn 0';if(!cats.some(c=>c[0]===f.cat))x.cat='Vui lòng chọn danh mục';if(!f.date||f.date>today())x.date='Ngày không hợp lệ';
if(Object.keys(x).length){setE(x);toast(x.amt||x.cat||x.date,'err');return}
lock.current=true;setBusy(true);
setTimeout(()=>{const ts=f.date===today()?Date.now():new Date(f.date+'T12:00:00').getTime();
upd(x=>x.txs.some(y=>y.op===dr.op)?x:{...x,txs:[{id:uid(),op:dr.op,type:f.type,cat:f.cat,amount:a,note:f.note.trim(),date:f.date,ts},...x.txs]});
setBusy(false);toast('Đã lưu giao dịch');if(onDone)onDone();go('home')},350)};
return html`<div className="card"><div className="mut" style=${{fontWeight:700}}>BẢN NHÁP TỪ HÓA ĐƠN</div>
<${Field} label="Số tiền" err=${e.amt}><${Amt} v=${f.amt} err=${e.amt} set=${v=>{setF({...f,amt:fmtIn(v)});setE({...e,amt:amtErr(v)})}}/><//>
<${Field} label="Danh mục" err=${e.cat}><div className="in"><select value=${f.cat} onChange=${ev=>setF({...f,cat:ev.target.value})}>${cats.map(c=>html`<option key=${c[0]} value=${c[0]}>${c[1]} ${c[0]}</option>`)}</select></div><//>
<${Field} label="Ghi chú"><div className="in"><input maxLength="80" value=${f.note} onChange=${ev=>setF({...f,note:ev.target.value})}/></div><//>
<${Field} label="Ngày"><div className="in"><input type="date" max=${today()} value=${f.date} onChange=${ev=>setF({...f,date:ev.target.value})}/></div><//>
<div className="row g8 mt"><button className="btn ghost" onClick=${onDone}>Huỷ</button><${Btn} busy=${busy} onClick=${ok}>Lưu giao dịch<//></div></div>`}

function Scan(){const{d,go}=useC();const[file,setFile]=useState(null),[url,setUrl]=useState(''),[busy,setBusy]=useState(false),[dr,setDr]=useState(null),[err,setErr]=useState(''),[mode,setMode]=useState(undefined);
const chk=()=>{setMode(undefined);AIS.mode().then(setMode)};useEffect(()=>{chk()},[]);
const pick=ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;if(!/^image\//.test(f.type)){toast('Vui lòng chọn file ảnh','err');return}if(f.size>15e6){toast('Ảnh quá lớn (tối đa 15MB)','err');return}setFile(f);setUrl(URL.createObjectURL(f));setDr(null);setErr('')};
const run=async()=>{if(busy||!file)return;if(!mode){setErr(aiErr({code:AIS.why}));return}setBusy(true);setErr('');setDr(null);
try{setDr(await AIS.parseReceipt(file,aiCtx(d)));toast('Đã đọc xong hóa đơn')}catch(e){setErr(aiErr(e));toast('Không nhận diện được hóa đơn','err')}setBusy(false)};
return html`<div className="scr"><${Head} t="Quét hóa đơn"/>
${mode===null&&html`<div className="alert" style=${{background:'var(--ol)',color:'var(--o)',cursor:'pointer'}} onClick=${chk}>${aiErr({code:AIS.why})} <b>Chạm để thử lại.</b></div>`}
<div className=${'scanbox'+(busy?' on':'')}>${url?html`<img src=${url} alt="Ảnh hóa đơn"/>`:'Chưa có ảnh hóa đơn'}</div>
<div className="row g8 mt"><label className="btn ghost" style=${{cursor:'pointer'}}>📷 Tải ảnh hóa đơn<input type="file" accept="image/*" hidden onChange=${pick}/></label><${Btn} busy=${busy} disabled=${!file} onClick=${run}>Phân tích AI<//></div>
${err&&html`<div className="alert" style=${{background:'var(--rl)',color:'var(--r)'}}>${err}</div>`}
${err&&html`<button className="btn ghost mt" onClick=${()=>go('add',{type:'expense'})}>Nhập thủ công</button>`}
${dr&&html`<${DraftCard} key=${dr.op} dr=${dr} onDone=${()=>{setFile(null);setUrl('');setDr(null)}}/>`}</div>`}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
